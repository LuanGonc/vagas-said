# Uma única conta UERJ do responsável atende os convidados autorizados.
# Copie para config.local.central.toml antes de editar.
[monitor]
database = "data/bot-central.sqlite3"
phase = "unknown"
interval_seconds = 60
jitter_fraction = 0.1
max_backoff_seconds = 900
max_failures = 5

[telegram]
# Executar o comando bot ativa a interface; CHAT_ID é ignorado.
enabled = false
env_file = ".env"

[bot]
# Obtenha seu ID pelo bot com a configuração de demonstração e envie /id.
admin_user_ids = []

[portal]
enabled = true
# Preencha UERJ_MATRICULA e UERJ_SENHA no .env da raiz do projeto.
env_file = ".env"
# Permite uma renovação automática por execução, somente após expiração reconhecida.
recover_once = true

# O catálogo e as turmas vêm do portal. Não há disciplinas HTML locais neste modo.
